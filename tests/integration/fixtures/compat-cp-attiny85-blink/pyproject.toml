[project]
name = "compat-cp-attiny85-blink"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pymcu-stdlib>=0.1.2a5",
    "pymcu>=0.1.0a27",
    "pymcu-circuitpython>=0.1.0",
]

[tool.pymcu]
board     = "attiny85"
frequency = 8000000
sources   = "src"
entry     = "main.py"
stdlib    = ["circuitpython"]
