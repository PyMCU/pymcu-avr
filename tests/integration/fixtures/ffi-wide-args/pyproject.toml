[project]
name = "ffi-wide-args"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pymcu-stdlib>=0.1.2a5",
    "pymcu>=0.1.0a27"
]

[tool.pymcu]
target = "atmega328p"
frequency = 16000000
sources = "src"
entry = "main.py"

# C interop: the callee reads full 16-bit parameters, so every argument register
# pair must arrive with both halves loaded.
[tool.pymcu.ffi]
sources = ["c_src/wide_args.c"]
include_dirs = ["c_src"]
cflags = ["-std=c11", "-Os"]
