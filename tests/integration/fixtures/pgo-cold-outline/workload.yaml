# The pull-up only raises GetPinState, not the PIN register the firmware
# reads -- drive PD2 high from t=0 so btn.value() == 1 and the else branch
# (the two strobe sites) stays cold under the workload.
scenarios:
  - name: idle
    run: {ms: 200}
    stimuli:
      - {at_us: 0, pin: PD2, level: 1}
    expect:
      uart_tx: "."
