name: CI

on:
  push:
    branches: ["main", "development", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:
  # ---------------------------------------------------------------------------
  # Toolchain supply-chain smoke test: runs on all target platforms.
  # Verifies that pymcu-avr-toolchain installs correctly and that the full
  # compile → link → objcopy pipeline works without system AVR tools.
  # ---------------------------------------------------------------------------
  build:
    name: Build C# (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout pymcu-avr
        uses: actions/checkout@v4
        with:
          path: pymcu-avr

      - name: Checkout pymcu monorepo
        uses: actions/checkout@v4
        with:
          repository: PyMCU/PyMCU
          ref: main
          path: PyMCU
          submodules: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: PyMCU/global.json

      - name: Build pymcuc compiler
        shell: bash
        working-directory: PyMCU
        run: dotnet publish src/compiler/PyMCU.csproj -c Release -o ../pymcu-avr/build/bin --nologo

      - name: Build pymcuc-avr backend CLI
        shell: bash
        working-directory: pymcu-avr
        run: dotnet publish src/csharp/cli/PyMCU.Backend.AVR.Cli.csproj -c Release -o build/bin --nologo

  # ---------------------------------------------------------------------------
  # Toolchain supply-chain smoke test: runs on all target platforms.
  # Verifies that pymcu-avr-toolchain installs correctly and that the full
  # compile → link → objcopy pipeline works without system AVR tools.
  # ---------------------------------------------------------------------------
  toolchain-smoke:
    name: Toolchain smoke (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-latest
          - name: linux-arm64
            runner: ubuntu-24.04-arm
          - name: macos-arm64
            runner: macos-latest
          - name: windows-x64
            runner: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout pymcu-avr
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          # Disable package cache so the latest published pymcu-avr-toolchain
          # is always installed, not a stale cached copy.
          enable-cache: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolchain + test deps
        run: |
          uv venv .venv
          uv pip install --python .venv pymcu-avr-toolchain pytest

      # One line on purpose. A `\` continuation is not a line continuation in
      # PowerShell, which is the default shell on the windows runner, so the split
      # version broke the command there, produced no smoke.xml, and the check below
      # then failed with FileNotFoundError instead of saying what went wrong.
      - name: Run toolchain smoke tests
        run: uv run --python .venv --no-project pytest tests/toolchain/ -v --tb=short --junitxml=smoke.xml

      # A green run that skipped almost everything reads exactly like a green run that
      # tested the wheel. Most of tests/toolchain skips itself when pymcu-avr is absent,
      # which is correct for this job and is also how the job could quietly stop
      # measuring anything at all.
      #
      # 6 is what this job can actually reach, measured in a venv built to match it
      # exactly: python + pytest + pymcu-avr-toolchain and nothing else gives
      # "6 passed, 133 skipped". The first version of this floor said 12, taken from a
      # "collected 12 items" line in a failing run -- a COLLECTION count from a run that
      # then errored, not a count of tests that ran. Two different numbers, and only one
      # of them is what this checks.
      #
      # That 133 of 139 tests here need pymcu-avr is itself worth someone's attention:
      # most of tests/toolchain is not testing the toolchain wheel. Not tonight's job.
      # If a change drops the 6, that is a thing to look at rather than a threshold to
      # lower.
      - name: The smoke run has to have actually run
        if: always()
        shell: bash
        run: |
          python3 - <<'EOF'
          import sys, os, xml.etree.ElementTree as ET
          if not os.path.exists("smoke.xml"):
              sys.exit("no smoke.xml: the pytest step did not run to completion, "
                       "so this says nothing about the wheel. Look at that step, not this one.")
          r = ET.parse("smoke.xml").getroot()
          s = r if r.tag == "testsuite" else r.find("testsuite")
          tot = int(s.get("tests", 0)); sk = int(s.get("skipped", 0))
          fail = int(s.get("failures", 0)) + int(s.get("errors", 0))
          ran = tot - sk
          print(f"ran {ran}, skipped {sk}, failed {fail}, of {tot} collected")
          # Per platform, because the floor is not the same everywhere and a single
          # number is either blind on Windows or useless on POSIX.
          # test_avr_supply_chain.py skips four cases on Windows for real reasons:
          # execute bits and symlinks, neither of which exists there. So 6 run on
          # linux and macos, 2 on windows. Measured, not assumed.
          floor = 2 if sys.platform.startswith("win") else 6
          if ran < floor:
              sys.exit(f"only {ran} tests actually ran, expected at least {floor} "
                       f"on {sys.platform}; this job is not measuring the wheel")
          EOF

  # ---------------------------------------------------------------------------
  # Unit tests for the C# AVR backend (codegen, linear scan, peephole).
  # Requires pymcu sibling checkout for the compiler/IR project references.
  # ---------------------------------------------------------------------------
  unit:
    name: Unit Tests (.NET)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout pymcu-avr
        uses: actions/checkout@v4
        with:
          path: pymcu-avr

      - name: Checkout pymcu monorepo
        uses: actions/checkout@v4
        with:
          repository: PyMCU/PyMCU
          ref: main
          path: PyMCU
          submodules: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: PyMCU/global.json

      - name: Restore packages
        working-directory: pymcu-avr
        run: dotnet restore tests/unit/PyMCU.AVR.UnitTests.csproj --nologo

      - name: Run unit tests
        working-directory: pymcu-avr
        run: |
          dotnet test tests/unit/PyMCU.AVR.UnitTests.csproj \
            --no-restore \
            --logger "trx;LogFileName=unit-results.trx" \
            --logger "console;verbosity=normal" \
            --collect:"XPlat Code Coverage" \
            --results-directory test-results \
            --nologo

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: pymcu-avr/test-results/
          retention-days: 15

  # ---------------------------------------------------------------------------
  # Full integration tests (AVR simulator). Linux only — simulator runs only on
  # Linux and requires the full compiler + Python environment.
  # ---------------------------------------------------------------------------
  integration:
    name: Integration Tests (AVR)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout pymcu-avr
        uses: actions/checkout@v4
        with:
          path: pymcu-avr

      # Checkout monorepo to build pymcuc (compiler binary).
      # TODO: replace with `pip install pymcu-compiler` once published to PyPI.
      - name: Checkout pymcu monorepo
        uses: actions/checkout@v4
        with:
          repository: PyMCU/PyMCU
          ref: main
          path: PyMCU
          submodules: recursive

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: PyMCU/global.json

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build pymcuc compiler
        working-directory: PyMCU
        run: |
          dotnet publish src/compiler/PyMCU.csproj \
            -c Release -o ../pymcu-avr/build/bin --nologo

      - name: Build pymcuc-avr backend CLI
        working-directory: pymcu-avr
        run: |
          dotnet publish src/csharp/cli/PyMCU.Backend.AVR.Cli.csproj \
            -c Release -o build/bin --nologo

      - name: Install Python dependencies
        working-directory: pymcu-avr
        run: |
          uv venv .venv
          uv pip install --python .venv pymcu-sdk
          uv pip install --python .venv -e ../PyMCU/lib  # use development stdlib (has all fixes)
          # The WASI toolchain, because that is what a user gets: pymcu-avr
          # depends on it, and `pip install "pymcu-compiler[avr]"` therefore
          # installs it. This job pulls the backend with --no-deps below, so
          # without this line it would silently fall through to the native
          # avr-gcc path instead, which no default install ships.
          #
          # That difference is not cosmetic. The two wheels carry avr-libc
          # generations with mutually exclusive float symbols -- WASI (2.2.0)
          # has floorf/fmodf, native (7.3.0) has floor/fmod -- and the compiler
          # emits the f-suffixed pair, so every float // and % links under one
          # and not the other. See issue #19.
          #
          # WHAT THIS JOB NO LONGER COVERS: the native avr-gcc link path in
          # toolchain/avr/avrgas.py. A green run here says nothing about it. It
          # is still reachable (PYMCU_AVR_WASI=0, or a system avr-gcc on PATH)
          # and is currently expected to fail on float math until the native
          # wheel moves off avr-libc 7.3.0.
          uv pip install --python .venv pymcu-avr-toolchain-wasi
          uv pip install --python .venv -e ../PyMCU
          uv pip install --python .venv questionary  # transitive dep of pymcu-compiler not resolved by uv pip -e
          uv pip install --python .venv -e . --no-deps
          uv pip install --python .venv -e ../PyMCU/external/pymcu-micropython
          uv pip install --python .venv -e ../PyMCU/external/pymcu-circuitpython

      - name: Configure environment
        working-directory: pymcu-avr
        run: |
          echo "$GITHUB_WORKSPACE/pymcu-avr/.venv/bin" >> $GITHUB_PATH
          echo "$GITHUB_WORKSPACE/pymcu-avr/build/bin" >> $GITHUB_PATH
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/pymcu-avr/.venv" >> $GITHUB_ENV

      # Pre-seed the toolchain cache and, more importantly, say out loud which
      # toolchain this job is about to test. A link failure naming a libm symbol
      # should not need an archaeology session to attribute (issue #19), so the
      # resolved wasm directory and the avr-libc version go in the log while the
      # run is green, not only once it is not.
      - name: Pre-seed AVR toolchain cache
        working-directory: pymcu-avr
        run: |
          "$GITHUB_WORKSPACE/pymcu-avr/.venv/bin/python3" -c "
          import pymcu_avr_toolchain_wasi as tc
          from pymcu.toolchain.avr import wasi
          print('toolchain     -> WASI (native avr-gcc path NOT covered by this job)')
          print('wasi package  ->', tc.__file__)
          print('wasm modules  ->', wasi.find_wasi_root())
          print('sysroot avr5  ->', tc.sysroot('avr5'))
          "

      - name: Restore integration test packages
        working-directory: pymcu-avr
        run: dotnet restore tests/integration/PyMCU.IntegrationTests.csproj --nologo

      - name: Run integration tests
        working-directory: pymcu-avr
        run: |
          dotnet test tests/integration/PyMCU.IntegrationTests.csproj \
            --no-restore \
            --logger "trx;LogFileName=integration-results.trx" \
            --logger "console;verbosity=normal" \
            --blame-hang-timeout 120s \
            --results-directory test-results \
            --nologo \
            -- NUnit.NumberOfTestWorkers=1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: pymcu-avr/test-results/
          retention-days: 15

  # ---------------------------------------------------------------------------
  # Language oracle: every probe in tests/oracle compiles through the real
  # `pymcu build` (sibling PyMCU compiler + this repo's backend) and runs on the
  # Avr8Sharp emulator; output is diffed against CPython. Runs under both front
  # ends. The corpus moved here from the PyMCU repo (the 2026-06 split left it
  # behind) because it needs the backend and the emulator, not just the frontend.
  # ---------------------------------------------------------------------------
  oracle:
    name: Oracle Suite (AVR8Sharp NuGet)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: pymcu-avr

    steps:
      - name: Checkout pymcu-avr
        uses: actions/checkout@v4
        with:
          path: pymcu-avr

      - name: Checkout pymcu monorepo
        uses: actions/checkout@v4
        with:
          repository: PyMCU/PyMCU
          ref: main
          path: PyMCU
          submodules: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: PyMCU/global.json

      - name: Build compiler, backend and NuGet oracle runner
        run: |
          dotnet publish ../PyMCU/src/compiler/PyMCU.csproj -c Release -o ../PyMCU/build/bin --nologo
          dotnet publish src/csharp/cli/PyMCU.Backend.AVR.Cli.csproj -c Release -o build/bin --nologo
          dotnet build tests/oracle/runner/PyMCU.OracleRunner.csproj -c Release -o build/oracle --nologo

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install beta source packages and AVR toolchain
        run: |
          uv venv .venv
          uv pip install --python .venv --no-sources pytest -e ../PyMCU/lib -e ../PyMCU/extensions/pymcu-sdk -e ../PyMCU -e .

      - name: Run oracle suites with both frontends
        env:
          PYMCU_BIN: ${{ github.workspace }}/pymcu-avr/.venv/bin/pymcu
          PYMCU_BACKEND_BINARY: avr=${{ github.workspace }}/pymcu-avr/build/bin/pymcuc-avr
          PYMCU_ORACLE_RUNNER: ${{ github.workspace }}/pymcu-avr/build/oracle/PyMCU.OracleRunner.dll
        run: |
          .venv/bin/python -m pytest tests/oracle -v --tb=short --junitxml=oracle-results.xml
          PYMCU_PY_PARSER=1 .venv/bin/python -m pytest tests/oracle -v --tb=short --junitxml=oracle-python-results.xml

      - name: Upload oracle results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-test-results
          path: pymcu-avr/oracle*-results.xml
          retention-days: 15

  # ---------------------------------------------------------------------------
  # IR verifier ratchet: compile every fixture, example and oracle probe with
  # PYMCU_VERIFY_IR=1 and diff the warnings against tools/verify_ir_baseline.json.
  # The corpus legitimately violates a few invariants today (some probes exist to
  # pin down a known miscompile), so the job is a ratchet, not a clean gate: it
  # fails only on NEW violation signatures or NEW compile failures. Tighten the
  # baseline with `python tools/verify_ir.py --write-baseline`.
  # ---------------------------------------------------------------------------
  verify-ir:
    name: IR Verifier Ratchet
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: pymcu-avr

    steps:
      - name: Checkout pymcu-avr
        uses: actions/checkout@v4
        with:
          path: pymcu-avr

      # submodules: recursive because compat-* probes import the
      # pymcu-micropython / pymcu-circuitpython layers that live in
      # PyMCU/external.
      - name: Checkout pymcu monorepo
        uses: actions/checkout@v4
        with:
          repository: PyMCU/PyMCU
          ref: main
          path: PyMCU
          submodules: recursive

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: PyMCU/global.json

      - name: Build compiler and backend
        run: |
          dotnet publish ../PyMCU/src/compiler/PyMCU.csproj -c Release -o ../PyMCU/build/bin --nologo
          dotnet publish src/csharp/cli/PyMCU.Backend.AVR.Cli.csproj -c Release -o build/bin --nologo

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Same install list as the oracle job: the corpus compiles the oracle
      # probes, and the compat-* ones only build when both compatibility
      # layers are present.
      - name: Install Python dependencies
        run: |
          uv venv .venv
          uv pip install --python .venv pymcu-sdk
          uv pip install --python .venv -e ../PyMCU/lib
          uv pip install --python .venv pymcu-avr-toolchain-wasi
          uv pip install --python .venv -e ../PyMCU
          uv pip install --python .venv questionary
          uv pip install --python .venv -e . --no-deps
          uv pip install --python .venv -e ../PyMCU/external/pymcu-micropython
          uv pip install --python .venv -e ../PyMCU/external/pymcu-circuitpython

      - name: Run the IR verifier corpus
        env:
          PYMCU_BIN: ${{ github.workspace }}/pymcu-avr/.venv/bin/pymcu
          PYMCU_BACKEND_BINARY: avr=${{ github.workspace }}/pymcu-avr/build/bin/pymcuc-avr
        run: .venv/bin/python tools/verify_ir.py --jobs 4

  # ---------------------------------------------------------------------------
  # CircuitPython oracle: the SSD1306 fixtures' I2C streams from real
  # CircuitPython 10.3.1 on the emulated Pico (RP2040Sharp) must match the
  # CPython oracle and the PyMCU AVR firmware byte for byte. RP2040Sharp is a
  # public sibling checkout; the project references its src projects directly
  # (see tests/oracle-circuitpython/README.md). Kept out of the integration
  # suite so it never pulls the Pico emulator into that job.
  # ---------------------------------------------------------------------------
  oracle-circuitpython:
    name: CircuitPython Oracle (RP2040Sharp)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: pymcu-avr

    steps:
      - name: Checkout pymcu-avr
        uses: actions/checkout@v4
        with:
          path: pymcu-avr

      - name: Checkout pymcu monorepo
        uses: actions/checkout@v4
        with:
          repository: PyMCU/PyMCU
          ref: main
          path: PyMCU
          submodules: false

      - name: Checkout RP2040Sharp
        uses: actions/checkout@v4
        with:
          repository: PyMCU/RP2040Sharp
          ref: master
          path: RP2040Sharp
          submodules: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: PyMCU/global.json

      - name: Build compiler and backend
        run: |
          dotnet publish ../PyMCU/src/compiler/PyMCU.csproj -c Release -o ../PyMCU/build/bin --nologo
          dotnet publish src/csharp/cli/PyMCU.Backend.AVR.Cli.csproj -c Release -o build/bin --nologo

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install beta source packages and AVR toolchain
        run: |
          uv venv .venv
          uv pip install --python .venv --no-sources pytest -e ../PyMCU/lib -e ../PyMCU/extensions/pymcu-sdk -e ../PyMCU -e .

      # The pinned UF2 plus the prepared 2 MiB flash snapshot (libraries
      # installed over the REPL); the stamp inside rebuilds the snapshot when a
      # fixture input changes, so the key only needs the firmware identity.
      - name: Cache CircuitPython firmware and snapshot
        uses: actions/cache@v4
        with:
          path: ~/.cache/pymcu-oracle
          key: pymcu-oracle-${{ runner.os }}-circuitpython-10.3.1

      - name: Run the CircuitPython oracle
        env:
          PYMCU_BIN: ${{ github.workspace }}/pymcu-avr/.venv/bin/pymcu
          PYMCU_BACKEND_BINARY: avr=${{ github.workspace }}/pymcu-avr/build/bin/pymcuc-avr
        run: |
          dotnet test tests/oracle-circuitpython/PyMCU.OracleCircuitPython.csproj \
            --logger "trx;LogFileName=oracle-circuitpython-results.trx" \
            --logger "console;verbosity=normal" \
            --results-directory test-results \
            --nologo \
            -- NUnit.NumberOfTestWorkers=1

      - name: Upload oracle results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-circuitpython-test-results
          path: pymcu-avr/test-results/
          retention-days: 15
