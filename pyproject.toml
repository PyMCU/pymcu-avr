[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "pymcu-avr"
version = "0.1.0a8"
description = "AVR support for pymcu-compiler: codegen backend + toolchain driver"
readme = "README.md"
authors = [
    { name = "Iván Montiel Cardona", email = "contact@pymcu.org" }
]
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pymcu-sdk>=0.1.0a4",
    # The whole AVR toolchain -- avr-as, avr-ld, avr-objcopy and the C/C++ front
    # ends -- as wasm32-wasip1 modules run through wasmtime. One
    # architecture-independent wheel instead of one native build per platform,
    # and no platform markers: it works wherever wasmtime has a wheel.
    "pymcu-avr-toolchain-wasi>=15.2.0",
]

[project.entry-points."pymcu.toolchains"]
avr = "pymcu.toolchain.avr:AvrToolchainPlugin"

[project.entry-points."pymcu.backends"]
avr = "pymcu.backend.avr:AvrBackendPlugin"

[tool.uv.sources]
pymcu-sdk = {git = "https://github.com/PyMCU/pymcu", subdirectory = "extensions/pymcu-sdk"}

[project.urls]
Homepage = "https://github.com/PyMCU/pymcu-avr"
Repository = "https://github.com/PyMCU/pymcu-avr"
"Bug Tracker" = "https://github.com/PyMCU/pymcu-avr/issues"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/python/pymcu"]
artifacts = ["src/python/pymcu/backend/avr/pymcuc-avr*"]
